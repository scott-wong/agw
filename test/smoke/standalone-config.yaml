# Standalone file-driven (no etcd) config for Server-header branding smoke test.
# APISIX 3.19: file-driven standalone = role data_plane + config_provider yaml.
# server_header is intentionally omitted here to exercise the AGW default.
apisix:
  node_listen:
    - port: 9080
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
