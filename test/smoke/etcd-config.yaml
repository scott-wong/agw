apisix:
  node_listen:
    - port: 9080
  server_header: agw-etcd
deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - http://${{ETCD_HOST:=etcd}}:2379
    prefix: /apisix
    timeout: 10
  admin:
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: agw-smoke-admin-key
        role: admin
