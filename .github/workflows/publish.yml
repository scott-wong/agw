name: agw publish

# Publication is tag-only. Candidate images for both distributions must pass
# every gate before final tags are created. Formal tags never include an
# ambiguous global "<version>" or "latest".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate immutable release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      upstream: ${{ steps.resolve.outputs.upstream }}
      repo: ${{ steps.resolve.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and verify version
        id: resolve
        run: |
          set -euo pipefail
          VERSION="$(tr -d ' \n' < VERSION)"
          UPSTREAM="${VERSION%%-*}"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          REPO="$(echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/agw" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${VERSION}"
            echo "upstream=${UPSTREAM}"
            echo "repo=${REPO}"
          } >> "$GITHUB_OUTPUT"
      - name: Cache verified source archives
        uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - run: make fetch
      - run: make verify

  resolve-images:
    name: Resolve pre-published release images
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      reuse_existing: ${{ steps.resolve.outputs.reuse_existing }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/install-security-tools.sh crane
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable tags
        id: resolve
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          UPSTREAM: ${{ needs.validate.outputs.upstream }}
          REPO: ${{ needs.validate.outputs.repo }}
        run: |
          set -euo pipefail
          TAGS=(
            "${VERSION}-openeuler" "${UPSTREAM}-openeuler" "latest-openeuler"
            "${VERSION}-ubuntu" "${UPSTREAM}-ubuntu" "latest-ubuntu"
          )
          ALL_EXIST=true
          ANY_EXIST=false
          for tag in "${TAGS[@]}"; do
            if crane digest "${REPO}:${tag}" >/dev/null 2>&1; then
              ANY_EXIST=true
            else
              ALL_EXIST=false
            fi
          done

          if [ "$ALL_EXIST" = true ]; then
            OPENEULER_DIGEST="$(crane digest "${REPO}:${VERSION}-openeuler")"
            UBUNTU_DIGEST="$(crane digest "${REPO}:${VERSION}-ubuntu")"
            for tag in "${UPSTREAM}-openeuler" "latest-openeuler"; do
              test "$(crane digest "${REPO}:${tag}")" = "$OPENEULER_DIGEST"
            done
            for tag in "${UPSTREAM}-ubuntu" "latest-ubuntu"; do
              test "$(crane digest "${REPO}:${tag}")" = "$UBUNTU_DIGEST"
            done
            python3 - "$OPENEULER_DIGEST" "$UBUNTU_DIGEST" > final-digests.json <<'PY'
          import json
          import sys
          print(json.dumps({"openeuler": sys.argv[1], "ubuntu": sys.argv[2]}, indent=2))
          PY
            echo "reuse_existing=true" >> "$GITHUB_OUTPUT"
            echo "已检测到两个变体的完整正式标签，复用现有 digest。"
          elif [ "$ANY_EXIST" = false ]; then
            echo "reuse_existing=false" >> "$GITHUB_OUTPUT"
            echo "未检测到正式标签，执行标准 candidate -> promote 流程。"
          else
            echo "ERROR: 正式标签只存在一部分，拒绝自动复用或覆盖" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.reuse_existing == 'true'
        with:
          name: agw-final-digests
          path: final-digests.json
          retention-days: 30
          if-no-files-found: error

  build-candidate:
    name: Candidate ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - resolve-images
    if: needs.resolve-images.outputs.reuse_existing != 'true'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant:
          - openeuler
          - ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - run: make fetch
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push candidate
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ matrix.variant }}-final
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}-candidate
          build-args: |
            AGW_VERSION=${{ needs.validate.outputs.version }}
          cache-from: type=gha,scope=agw-${{ matrix.variant }}
          cache-to: type=gha,mode=min,scope=agw-${{ matrix.variant }}
      - name: Record candidate digest
        run: |
          mkdir -p digest
          echo "${{ steps.push.outputs.digest }}" > "digest/${{ matrix.variant }}.digest"
          cat "digest/${{ matrix.variant }}.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: agw-candidate-digest-${{ matrix.variant }}
          path: digest/${{ matrix.variant }}.digest
          retention-days: 7
          if-no-files-found: error

  verify-candidate:
    name: Verify candidate ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - resolve-images
      - build-candidate
    if: needs.resolve-images.outputs.reuse_existing != 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - openeuler
          - ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull candidate
        run: |
          docker pull "${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}-candidate"
      - name: Candidate image smoke
        run: |
          bash scripts/smoke-docker.sh \
            "${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}-candidate" \
            "${{ matrix.variant }}" \
            "${{ needs.validate.outputs.version }}"
      - name: Candidate external-etcd smoke
        run: |
          bash scripts/smoke-etcd.sh \
            "${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}-candidate"

  supply-chain-candidate:
    name: Supply chain candidate ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - resolve-images
      - build-candidate
    if: needs.resolve-images.outputs.reuse_existing != 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - openeuler
          - ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash scripts/install-security-tools.sh syft trivy
      - name: Generate candidate SBOM
        run: |
          set -euo pipefail
          mkdir -p artifacts
          REF="${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}-candidate"
          docker pull "$REF"
          syft scan "docker:${REF}" -o cyclonedx-json \
            > "artifacts/agw-${{ needs.validate.outputs.version }}-${{ matrix.variant }}.cyclonedx.json"
      - name: Blocking Trivy scan
        run: |
          set -euo pipefail
          REF="${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}-candidate"
          SKIP_FILES=(
            --skip-files "/usr/local/apisix/conf/cert/ssl_PLACE_HOLDER.key"
            --skip-files "**/apisix/conf/cert/ssl_PLACE_HOLDER.key"
            --skip-files "/usr/local/openresty/pod/lua-resty-rsa-*.pod"
            --skip-files "**/lua-resty-rsa-*.pod"
          )
          set +e
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --format sarif \
            -o "artifacts/trivy-${{ matrix.variant }}.sarif" \
            "${SKIP_FILES[@]}" "$REF"
          rc=$?
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 0 --format table \
            "${SKIP_FILES[@]}" "$REF" > "artifacts/trivy-${{ matrix.variant }}.txt" 2>&1 || true
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agw-candidate-sbom-${{ matrix.variant }}
          path: artifacts/*.cyclonedx.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agw-candidate-trivy-${{ matrix.variant }}
          path: |
            artifacts/trivy-${{ matrix.variant }}.sarif
            artifacts/trivy-${{ matrix.variant }}.txt
          retention-days: 30
          if-no-files-found: warn

  promote:
    name: Promote both candidates to final tags
    runs-on: ubuntu-latest
    needs:
      - validate
      - resolve-images
      - verify-candidate
      - supply-chain-candidate
    if: needs.resolve-images.outputs.reuse_existing != 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agw-candidate-digest-*
          path: digest
          merge-multiple: true
      - run: bash scripts/install-security-tools.sh crane
      - name: Promote exact candidate digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ needs.validate.outputs.repo }}"
          VERSION="${{ needs.validate.outputs.version }}"
          UPSTREAM="${{ needs.validate.outputs.upstream }}"
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          test -s digest/openeuler.digest
          test -s digest/ubuntu.digest
          OPENEULER_DIGEST="$(tr -d ' \n' < digest/openeuler.digest)"
          UBUNTU_DIGEST="$(tr -d ' \n' < digest/ubuntu.digest)"
          [[ "$OPENEULER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$UBUNTU_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          FINAL_TAGS=(
            "${VERSION}-openeuler" "${UPSTREAM}-openeuler" "latest-openeuler"
            "${VERSION}-ubuntu" "${UPSTREAM}-ubuntu" "latest-ubuntu"
          )
          for tag in "${FINAL_TAGS[@]}"; do
            if crane digest "${REPO}:${tag}" >/dev/null 2>&1; then
              echo "ERROR: 发布标签已存在，拒绝移动: ${REPO}:${tag}" >&2
              exit 1
            fi
          done

          crane tag "${REPO}@${OPENEULER_DIGEST}" "${VERSION}-openeuler"
          crane tag "${REPO}@${OPENEULER_DIGEST}" "${UPSTREAM}-openeuler"
          crane tag "${REPO}@${OPENEULER_DIGEST}" "latest-openeuler"
          crane tag "${REPO}@${UBUNTU_DIGEST}" "${VERSION}-ubuntu"
          crane tag "${REPO}@${UBUNTU_DIGEST}" "${UPSTREAM}-ubuntu"
          crane tag "${REPO}@${UBUNTU_DIGEST}" "latest-ubuntu"

          python3 - "$OPENEULER_DIGEST" "$UBUNTU_DIGEST" > final-digests.json <<'PY'
          import json
          import sys
          print(json.dumps({"openeuler": sys.argv[1], "ubuntu": sys.argv[2]}, indent=2))
          PY
          cat final-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: agw-final-digests
          path: final-digests.json
          retention-days: 30
          if-no-files-found: error

  verify-final:
    name: Verify final ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - resolve-images
      - promote
    if: >-
      always() &&
      needs.resolve-images.result == 'success' &&
      (
        needs.resolve-images.outputs.reuse_existing == 'true' ||
        needs.promote.result == 'success'
      )
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant:
          - openeuler
          - ubuntu
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull final image
        run: |
          docker pull "${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}"
      - name: Final image smoke
        run: |
          bash scripts/smoke-docker.sh \
            "${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}" \
            "${{ matrix.variant }}" \
            "${{ needs.validate.outputs.version }}"
      - name: Final external-etcd smoke
        run: |
          bash scripts/smoke-etcd.sh \
            "${{ needs.validate.outputs.repo }}:${{ needs.validate.outputs.version }}-${{ matrix.variant }}"

  release:
    name: Generate assets and GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate
      - resolve-images
      - promote
      - verify-final
    if: >-
      always() &&
      needs.resolve-images.result == 'success' &&
      needs.verify-final.result == 'success' &&
      (
        needs.resolve-images.outputs.reuse_existing == 'true' ||
        needs.promote.result == 'success'
      )
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agw-final-digests
          path: .
      - run: bash scripts/install-security-tools.sh syft
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate final SBOMs
        run: |
          set -euo pipefail
          mkdir -p release-assets
          REPO="${{ needs.validate.outputs.repo }}"
          VERSION="${{ needs.validate.outputs.version }}"
          for variant in openeuler ubuntu; do
            REF="${REPO}:${VERSION}-${variant}"
            docker pull "$REF"
            syft scan "docker:${REF}" -o cyclonedx-json \
              > "release-assets/agw-${VERSION}-${variant}.cyclonedx.json"
          done
          ls -lh release-assets
      - name: Write release manifest
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OPENEULER_SBOM: ${{ github.workspace }}/release-assets/agw-${{ needs.validate.outputs.version }}-openeuler.cyclonedx.json
          UBUNTU_SBOM: ${{ github.workspace }}/release-assets/agw-${{ needs.validate.outputs.version }}-ubuntu.cyclonedx.json
          OUT: ${{ github.workspace }}/release-assets/release-manifest.json
        run: |
          OPENEULER_DIGEST="$(python3 -c 'import json; print(json.load(open("final-digests.json"))["openeuler"])')"
          UBUNTU_DIGEST="$(python3 -c 'import json; print(json.load(open("final-digests.json"))["ubuntu"])')"
          export OPENEULER_DIGEST UBUNTU_DIGEST
          bash scripts/write-release-manifest.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          REPO: ${{ needs.validate.outputs.repo }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG 已存在；不可移动，请 bump VERSION" >&2
            exit 1
          fi
          OPENEULER_DIGEST="$(python3 -c 'import json; print(json.load(open("final-digests.json"))["openeuler"])')"
          UBUNTU_DIGEST="$(python3 -c 'import json; print(json.load(open("final-digests.json"))["ubuntu"])')"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          AGW ${VERSION} 同时发布两个镜像变体（linux/amd64）：

          - openEuler 24.03 LTS SP4: ${REPO}:${VERSION}-openeuler, ${REPO}:${{ needs.validate.outputs.upstream }}-openeuler, ${REPO}:latest-openeuler
            digest: ${OPENEULER_DIGEST}
          - Ubuntu 24.04: ${REPO}:${VERSION}-ubuntu, ${REPO}:${{ needs.validate.outputs.upstream }}-ubuntu, ${REPO}:latest-ubuntu
            digest: ${UBUNTU_DIGEST}

          本版本不交付 RPM、不提供离线镜像 tar。附件包含两个 CycloneDX SBOM 与 release-manifest.json。
          Trivy 为唯一阻断扫描器；openEuler 的 OS RPM 漏洞库覆盖在 Trivy 中仍为 unsupported。
          EOF
          gh release create "$TAG" \
            release-assets/agw-${VERSION}-openeuler.cyclonedx.json \
            release-assets/agw-${VERSION}-ubuntu.cyclonedx.json \
            release-assets/release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "AGW ${VERSION}" \
            --notes-file "$NOTES"
