name: agw build

# Build and gate both final images. Publishing/promotion is handled separately
# by publish.yml only after a v<version> tag is created.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  baseline:
    name: Baseline and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache verified source archives
        uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - name: verify baseline and snapshot
        run: make fetch
      - name: static checks
        run: make verify

  image:
    name: Image ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: baseline
    strategy:
      fail-fast: false
      matrix:
        variant:
          - openeuler
          - ubuntu
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Restore verified source archives
        uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - name: Ensure baseline archives exist
        run: make fetch
      - name: Build final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ matrix.variant }}-final
          load: true
          push: false
          tags: agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci
          build-args: |
            AGW_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=agw-${{ matrix.variant }}
          cache-to: type=gha,mode=min,scope=agw-${{ matrix.variant }}
      - name: Image and Server-header smoke
        run: |
          bash scripts/smoke-docker.sh \
            "agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci" \
            "${{ matrix.variant }}" \
            "${{ steps.ver.outputs.version }}"
      - name: External etcd and Admin API smoke
        run: |
          bash scripts/smoke-etcd.sh \
            "agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci"
      - name: Install pinned Syft and Trivy
        run: bash scripts/install-security-tools.sh syft trivy
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p artifacts
          IMAGE="agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci"
          syft scan "docker:${IMAGE}" -o cyclonedx-json \
            > "artifacts/agw-${{ steps.ver.outputs.version }}-${{ matrix.variant }}.cyclonedx.json"
          syft version
          ls -lh artifacts
      - name: Trivy blocking scan (HIGH,CRITICAL,vuln+secret)
        run: |
          set -euo pipefail
          IMAGE="agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci"
          SKIP_FILES=(
            --skip-files "/usr/local/apisix/conf/cert/ssl_PLACE_HOLDER.key"
            --skip-files "**/apisix/conf/cert/ssl_PLACE_HOLDER.key"
            --skip-files "/usr/local/openresty/pod/lua-resty-rsa-*.pod"
            --skip-files "**/lua-resty-rsa-*.pod"
          )
          set +e
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --format sarif \
            -o "artifacts/trivy-${{ matrix.variant }}.sarif" \
            "${SKIP_FILES[@]}" "$IMAGE"
          rc=$?
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 0 --format table \
            "${SKIP_FILES[@]}" "$IMAGE" > "artifacts/trivy-${{ matrix.variant }}.txt" 2>&1 || true
          trivy --version
          exit "$rc"
      - name: Collect non-blocking OS security evidence
        if: matrix.variant == 'openeuler'
        continue-on-error: true
        run: |
          IMAGE="agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci"
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'dnf updateinfo --security 2>&1 || true' \
            > "artifacts/openEuler-security-evidence.txt"
      - name: Write build evidence
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "version=${{ steps.ver.outputs.version }}"
            echo "variant=${{ matrix.variant }}"
            echo "source_commit=${{ github.sha }}"
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "image=agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci"
            docker image inspect "agw:${{ steps.ver.outputs.version }}-${{ matrix.variant }}-ci" \
              --format 'image_id={{.Id}} base_digest={{index .Config.Labels "org.opencontainers.image.base.digest"}}' \
              || true
          } > "artifacts/build-${{ matrix.variant }}.txt"
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agw-sbom-${{ matrix.variant }}
          path: artifacts/*.cyclonedx.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Trivy SARIF and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agw-trivy-${{ matrix.variant }}
          path: |
            artifacts/trivy-${{ matrix.variant }}.sarif
            artifacts/trivy-${{ matrix.variant }}.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agw-build-evidence-${{ matrix.variant }}
          path: artifacts/build-${{ matrix.variant }}.txt
          retention-days: 30
          if-no-files-found: warn

  ratio:
    name: Self-developed ratio
    runs-on: ubuntu-latest
    needs: baseline
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source archives
        uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - run: make fetch
      - run: bash scripts/gen-self-ratio.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agw-self-developed-ratio
          path: evidence/09-ip/self-developed-ratio.json
          retention-days: 30

  evidence:
    name: Archive current SBOM evidence
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: agw-sbom-*
          path: evidence/04-sbom
          merge-multiple: true
      - name: Commit SBOM evidence
        run: |
          set -euo pipefail
          git config user.name "agw-ci-bot"
          git config user.email "agw-ci-bot@users.noreply.github.com"
          git add evidence/04-sbom/
          if git diff --cached --quiet; then
            echo "[evidence] no SBOM change"
            exit 0
          fi
          git commit -m "ci(agw): archive 3.19 image SBOMs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  debrand:
    name: De-brand gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-debrand.sh

  gate:
    name: Build gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - baseline
      - image
      - ratio
      - debrand
    steps:
      - name: Require every build job
        run: |
          test "${{ needs.baseline.result }}" = success
          test "${{ needs.image.result }}" = success
          test "${{ needs.ratio.result }}" = success
          test "${{ needs.debrand.result }}" = success
