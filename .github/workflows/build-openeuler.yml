name: agw build openeuler

# Independent openEuler pipeline. It never waits for the Ubuntu build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the gated openEuler image to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: openEuler baseline and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - run: make fetch
      - run: make verify
      - run: bash scripts/verify-debrand.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agw-openeuler-self-developed-ratio
          path: evidence/09-ip/self-developed-ratio.json
          retention-days: 30

  image:
    name: Build and gate openEuler image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: echo "version=$(tr -d ' \n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: agw-source-pins-${{ runner.os }}-${{ hashFiles('scripts/baseline.env') }}
      - run: make fetch
      - name: Build openEuler final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: openeuler-final
          load: true
          push: false
          tags: agw:${{ steps.ver.outputs.version }}-openeuler-ci
          build-args: |
            AGW_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=agw-openeuler
          # mode=max exports builder stages too; otherwise every run recompiles
          # Tongsuo and OpenResty even when their inputs have not changed.
          cache-to: type=gha,mode=max,ignore-error=true,scope=agw-openeuler
      - name: Image and Server-header smoke
        run: |
          bash scripts/smoke-docker.sh \
            "agw:${{ steps.ver.outputs.version }}-openeuler-ci" \
            openeuler \
            "${{ steps.ver.outputs.version }}"
      - name: External etcd and Admin API smoke
        run: |
          bash scripts/smoke-etcd.sh \
            "agw:${{ steps.ver.outputs.version }}-openeuler-ci"
      - run: bash scripts/install-security-tools.sh syft trivy
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p artifacts
          IMAGE="agw:${{ steps.ver.outputs.version }}-openeuler-ci"
          syft scan "docker:${IMAGE}" -o cyclonedx-json \
            > "artifacts/agw-${{ steps.ver.outputs.version }}-openeuler.cyclonedx.json"
      - name: Trivy blocking scan
        run: |
          set -euo pipefail
          IMAGE="agw:${{ steps.ver.outputs.version }}-openeuler-ci"
          SKIP_FILES=(
            --skip-files "/usr/local/apisix/conf/cert/ssl_PLACE_HOLDER.key"
            --skip-files "**/apisix/conf/cert/ssl_PLACE_HOLDER.key"
            --skip-files "/usr/local/openresty/pod/lua-resty-rsa-*.pod"
            --skip-files "**/lua-resty-rsa-*.pod"
          )
          set +e
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 1 --format sarif -o artifacts/trivy-openeuler.sarif \
            "${SKIP_FILES[@]}" "$IMAGE"
          rc=$?
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL \
            --exit-code 0 --format table \
            "${SKIP_FILES[@]}" "$IMAGE" > artifacts/trivy-openeuler.txt 2>&1 || true
          exit "$rc"
      - name: Collect openEuler security evidence
        continue-on-error: true
        run: |
          IMAGE="agw:${{ steps.ver.outputs.version }}-openeuler-ci"
          docker run --rm --entrypoint bash "$IMAGE" -c \
            'env -u LD_LIBRARY_PATH dnf updateinfo --security 2>&1 || true' \
            > artifacts/openEuler-security-evidence.txt
      - name: Build evidence
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "version=${{ steps.ver.outputs.version }}"
            echo "variant=openeuler"
            echo "source_commit=${{ github.sha }}"
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            docker image inspect "agw:${{ steps.ver.outputs.version }}-openeuler-ci" \
              --format 'image_id={{.Id}} base_digest={{index .Config.Labels "org.opencontainers.image.base.digest"}}' \
              || true
          } > artifacts/build-openeuler.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agw-openeuler-sbom
          path: artifacts/*.cyclonedx.json
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agw-openeuler-trivy
          path: |
            artifacts/trivy-openeuler.sarif
            artifacts/trivy-openeuler.txt
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agw-openeuler-evidence
          path: |
            artifacts/build-openeuler.txt
            artifacts/openEuler-security-evidence.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish openEuler image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GHCR_REPO: ghcr.io/scott-wong/agw
        run: |
          set -euo pipefail
          UPSTREAM="${VERSION%%-*}"
          SOURCE="agw:${VERSION}-openeuler-ci"
          TAGS=(
            "${VERSION}-openeuler"
            "${UPSTREAM}-openeuler"
            "latest-openeuler"
          )

          for tag in "${TAGS[@]}"; do
            REF="${GHCR_REPO}:${tag}"
            if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
              echo "ERROR: 发布标签已存在，拒绝移动: ${REF}" >&2
              exit 1
            fi
          done

          mkdir -p artifacts
          : > artifacts/publish-openeuler.txt
          for tag in "${TAGS[@]}"; do
            REF="${GHCR_REPO}:${tag}"
            docker tag "$SOURCE" "$REF"
            docker push "$REF" | tee -a artifacts/publish-openeuler.txt
          done

          IMMUTABLE_REF="${GHCR_REPO}:${VERSION}-openeuler"
          DIGEST="$(docker buildx imagetools inspect "$IMMUTABLE_REF" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${DIGEST}" >> artifacts/publish-openeuler.txt
          {
            echo "### openEuler image published"
            echo
            echo "| tag | digest |"
            echo "|---|---|"
            for tag in "${TAGS[@]}"; do
              echo "| \`${GHCR_REPO}:${tag}\` | \`${DIGEST}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        with:
          name: agw-openeuler-publish
          path: artifacts/publish-openeuler.txt
          retention-days: 30
          if-no-files-found: error
