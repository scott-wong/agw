# Grype 忽略清单：仅保留已审批、上游暂无可安装修复的风险例外。
# 生效位置：.github/workflows/build.yml 与 publish.yml 在仓库根目录执行
#   grype <image> -c .grype.yaml --fail-on high
# 匹配规则：CVE + 组件 + 已安装版本三者同时命中才忽略；基础镜像一旦升级这些包，
# 本条即失效并重新拦截，必须重新评估后再决定是否续期。
# 发现批次：AGW 镜像基线扫描（Anolis 8.10 基础层 RPM 数据库，2026-09-14 首次登记）。
# 无修复依据：Dockerfile 构建阶段已执行 dnf -y update，装机版本即 Anolis 8.10 仓库最新；
# Grype 数据源为 redhat:distro:redhat:8，能给出修复版本的条目（如 expat
# CVE-2026-45186 → 0:2.5.0-2.el8_10）均指向 RHEL el8_10 勘误，Anolis 8 尚未合入；
# 其余条目 Fix Version 为空（未知/未修复）。
# 复核到期：2026-10-14。到期后删除忽略项并重扫，确认有修复则升级基础包，不得直接延期。
# 风险接受记录与暴露面分析见 evidence/06-security/SECURITY.md。
